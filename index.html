<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Harsh Sanwal portfolio">
  <title>Harsh Sanwal — portfolio</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fff;
      color: #24272d;
    }
    .page { min-height: 100vh; padding: 30px 0; }
    .card {
      width: 100%;
      min-height: 275px;
      border: 1px solid #d2d7dc;
      border-radius: 0 0 10px 10px;
      padding: 34px 4.2%;
      background: #fff;
    }
    h1 {
      margin: 0;
      padding: 0 0 28px;
      border-bottom: 1px solid #d7dce1;
      font-size: clamp(38px, 4.3vw, 62px);
      line-height: 1.05;
      letter-spacing: -2.5px;
      font-weight: 750;
    }
    .redirect {
      margin: 42px 0 0;
      font-size: clamp(24px, 2.4vw, 34px);
      line-height: 1.3;
    }
    .redirect-label { margin-right: 8px; }
    .portfolio-link {
      color: #0969da;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
      overflow-wrap: anywhere;
      transition: color .15s ease;
    }
    .portfolio-link:hover { color: #0550ae; }
    .portfolio-link:focus-visible {
      outline: 3px solid rgba(9,105,218,.25);
      outline-offset: 4px;
      border-radius: 3px;
    }
    @media (max-width: 650px) {
      .page { padding-top: 0; }
      .card { min-height: 250px; padding: 28px 22px; }
      h1 { letter-spacing: -1.5px; padding-bottom: 22px; }
      .redirect { margin-top: 34px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-label="Harsh Sanwal portfolio">
      <h1>Harsh Sanwal — portfolio</h1>
      <p class="redirect">
        <span class="redirect-label">Click To Redirect-</span>
        <a class="portfolio-link"
           href="https://harsh-sanwal-portfolio-rc4px52ej-hearthn-sky.vercel.app/"
           target="_blank"
           rel="noopener noreferrer">
          https://harsh-sanwal-portfolio-rc4px52ej-hearthn-sky.vercel.app/
        </a>
      </p>
    </section>
  </main>
</body>
</html>
